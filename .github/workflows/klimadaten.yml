name: Klimadaten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
      - name: Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
      - name: Klimadaten erstellen
        run: node scripts/build_klimadaten.mjs
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/klimadaten.json
          git diff --cached --quiet || git commit -m "Update climate data"
          git push
